apiVersion: v1
kind: Secret
metadata:
  name: cve-analyzer-secrets
  namespace: cve-analyzer
  labels:
    app: cve-analyzer
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual values or use AWS Secrets Manager / External Secrets
  # For production, DO NOT commit actual secrets to git
  # Use: kubectl create secret generic cve-analyzer-secrets --from-literal=NVD_API_KEY=your-key-here -n cve-analyzer

  NVD_API_KEY: ""  # Optional: NIST NVD API key for higher rate limits
  # AWS credentials are provided by IRSA (IAM Roles for Service Accounts) - see serviceaccount.yaml
