apiVersion: v1
kind: Service
metadata:
  name: cve-analyzer
  namespace: cve-analyzer
  labels:
    app: cve-analyzer
  annotations:
    # AWS Load Balancer Controller annotations for public ALB
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

    # Health check configuration
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/_stcore/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8501"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"

    # Optional: SSL/TLS configuration
    # Uncomment and configure if you have an ACM certificate
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:region:account-id:certificate/cert-id"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"

    # Optional: Access logs
    # service.beta.kubernetes.io/aws-load-balancer-access-log-enabled: "true"
    # service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-name: "your-s3-bucket"
    # service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-prefix: "cve-analyzer"

    # Optional: Security groups
    # service.beta.kubernetes.io/aws-load-balancer-security-groups: "sg-xxxxxxxx"

    # Tags for cost allocation
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Application=CVE-Analyzer,Team=Security,Environment=Production"

spec:
  type: LoadBalancer  # Creates AWS NLB

  # Session affinity for better user experience
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

  selector:
    app: cve-analyzer

  ports:
  - name: http
    protocol: TCP
    port: 80           # External port
    targetPort: 8501   # Container port

  # Optional: HTTPS port (requires SSL certificate annotation above)
  # - name: https
  #   protocol: TCP
  #   port: 443
  #   targetPort: 8501
