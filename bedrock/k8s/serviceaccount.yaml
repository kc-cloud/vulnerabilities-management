apiVersion: v1
kind: ServiceAccount
metadata:
  name: cve-analyzer-sa
  namespace: cve-analyzer
  labels:
    app: cve-analyzer
  annotations:
    # IMPORTANT: Replace with your actual IAM role ARN that has Bedrock permissions
    # This uses IRSA (IAM Roles for Service Accounts) for AWS authentication
    #
    # To create the IAM role:
    # 1. Create IAM role with trust policy for EKS OIDC provider
    # 2. Attach policy with Bedrock permissions (bedrock:InvokeModel)
    # 3. Add the role ARN here
    #
    # Example:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cve-analyzer-bedrock-role
    eks.amazonaws.com/role-arn: ""  # REPLACE WITH YOUR IAM ROLE ARN
